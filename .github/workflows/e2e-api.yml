name: ERP E2E API

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JWT_SECRET: ci-validation-jwt-secret
  SERVICE_SECRET: ci-validation-service-secret
  INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  OTP_PEPPER: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  OTEL_SDK_DISABLED: "true"
  COMPOSE_PARALLEL_LIMIT: "1"

jobs:
  e2e-api:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system df || true

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API E2E gate
        run: bash scripts/ci-e2e.sh

      - name: Dump Compose logs
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=200 postgres gateway sales inventory accounting hr procurement delivery || true

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            docs/E2E-GREENFIELD-latest.md
            docs/E2E-GST-latest.md
            docs/E2E-REPORT-latest.md
            docs/E2E-SAAS-BILLING-latest.md
            docs/TENANT-GST-E2E-CHECKLIST.md
          if-no-files-found: ignore
