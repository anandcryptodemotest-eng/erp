# ERP Microservices - Docker Compose
# Apps: docker compose up -d
# Observability: docker compose --profile obs up -d

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
      POSTGRES_DB: erp_gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      args:
        SALES_SERVICE_URL: http://sales:3001
        INVENTORY_SERVICE_URL: http://inventory:3002
        ACCOUNTING_SERVICE_URL: http://accounting:3003
        HR_SERVICE_URL: http://hr:3004
        PROCUREMENT_SERVICE_URL: http://procurement:3005
        DELIVERY_SERVICE_URL: http://delivery:3006
        GATEWAY_SERVICE_URL: http://gateway:3010
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/erp_gateway
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET before starting the stack}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      OTP_PEPPER: ${OTP_PEPPER:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      SERVICE_NAME: gateway
      SERVICE_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SALES_SERVICE_URL: http://sales:3001
      INVENTORY_SERVICE_URL: http://inventory:3002
      ACCOUNTING_SERVICE_URL: http://accounting:3003
      HR_SERVICE_URL: http://hr:3004
      PROCUREMENT_SERVICE_URL: http://procurement:3005
      DELIVERY_SERVICE_URL: http://delivery:3006
      # Writable by container user (nextjs). Named volumes are root-owned unless chowned.
      UPLOAD_ROOT: /tmp/erp-uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/admin/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  sales:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/sales/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/erp_sales
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET before starting the stack}
      SERVICE_NAME: sales
      SERVICE_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GATEWAY_URL: http://gateway:3010
      CORE_SERVICE_URL: http://gateway:3010
      INVENTORY_SERVICE_URL: http://inventory:3002
      ACCOUNTING_SERVICE_URL: http://accounting:3003
      PROCUREMENT_SERVICE_URL: http://procurement:3005
      DELIVERY_SERVICE_URL: http://delivery:3006
      TAX_RATE: ${TAX_RATE:-0.10}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  inventory:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/inventory/Dockerfile
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/erp_inventory
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET before starting the stack}
      SERVICE_NAME: inventory
      SERVICE_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GATEWAY_URL: http://gateway:3010
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  accounting:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/accounting/Dockerfile
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/erp_accounting
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET before starting the stack}
      SERVICE_NAME: accounting
      SERVICE_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GATEWAY_URL: http://gateway:3010
      CORE_SERVICE_URL: http://gateway:3010
      SALES_SERVICE_URL: http://sales:3001
      HR_SERVICE_URL: http://hr:3004
      PROCUREMENT_SERVICE_URL: http://procurement:3005
      FILE_STORE_ROOT: /var/lib/erp-files
    volumes:
      - erp-files:/var/lib/erp-files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  hr:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/hr/Dockerfile
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/erp_hr
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET before starting the stack}
      SERVICE_NAME: hr
      SERVICE_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GATEWAY_URL: http://gateway:3010
      ACCOUNTING_SERVICE_URL: http://accounting:3003
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  procurement:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/procurement/Dockerfile
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/erp_procurement
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET before starting the stack}
      SERVICE_NAME: procurement
      SERVICE_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GATEWAY_URL: http://gateway:3010
      INVENTORY_SERVICE_URL: http://inventory:3002
      ACCOUNTING_SERVICE_URL: http://accounting:3003
      TAX_RATE: ${TAX_RATE:-0.10}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  delivery:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/delivery/Dockerfile
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/erp_delivery
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET before starting the stack}
      SERVICE_NAME: delivery
      SERVICE_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GATEWAY_URL: http://gateway:3010
      SALES_SERVICE_URL: http://sales:3001
      HR_SERVICE_URL: http://hr:3004
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Observability only — does not build/start app images
  otel-collector:
    restart: unless-stopped
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    restart: unless-stopped
    profiles: ["obs"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  loki:
    restart: unless-stopped
    profiles: ["obs"]
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"

  prometheus:
    restart: unless-stopped
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver

  grafana:
    restart: unless-stopped
    profiles: ["obs"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  promtail:
    restart: unless-stopped
    profiles: ["obs"]
    image: grafana/promtail:3.2.1
    volumes:
      - ./ops/otel/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki

volumes:
  pgdata:
  erp-files:
  tempo-data:
  prometheus-data:
  grafana-data:
