# P2 stub — swap OTLP exporters for CloudWatch / X-Ray in AWS.
# Wire via OTEL_EXPORTER_OTLP_ENDPOINT or replace exporters block.
#
# Example (not active):
# exporters:
#   awsxray: {}
#   awsemf: {}
extensions: {}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
